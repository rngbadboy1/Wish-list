<!DOCTYPE html>
<!--
=============================================================================
 WISHLIST MANAGER  -  single-file app (HTML + CSS + JS)
=============================================================================

PROJECT SUMMARY
  A personal, shareable wishlist / purchase planner. No login, no backend.
  Static page (GitHub Pages) + Cloud Firestore (Web SDK v10 modular, live
  onSnapshot + offline cache). Plan short/long-term purchases in "groups"
  (3 Months, 1 Year, House, PC Build, Dream ...), with categories, custom
  fields, manual prices + price history, dashboard, budget planner, backups
  (xlsx/csv/json), view-only share link (?view=1), bn/en UI, light/dark theme.
  DATA is only in Firestore. localStorage is used ONLY for theme + language.

FULL SCHEMA (Firestore)  -  schemaVersion 1
  meta/app        : { schemaVersion:number(1), currencySymbol:string, siteTitle:string }
  groups/{id}     : { name, icon, color, order:number,
                      fieldDefs:[{key,label,type,options:[]}],   // type: text|number|date|select|checkbox|url
                      createdAt, updatedAt }
  categories/{id} : { groupId, name, order:number, createdAt, updatedAt }
  items/{id}      : { groupId, categoryId(""=none), name, productLink, imageUrl,
                      price:number, quantity:number(default 1),
                      priority:"high|medium|low", status:"want|bought|skipped",
                      targetDate:"YYYY-MM-DD" or "", description, notes,
                      custom:{[fieldKey]:value}, priceHistory:[{date,price}],
                      boughtAt, createdAt, updatedAt }
  Timestamps use serverTimestamp(). Custom values are stored by stable field
  `key` (never by label) so renaming a label never loses data.

HOW TO EXTEND (rules for humans and AIs)
  1. Backward compatible ONLY: new features may ADD optional fields. Never
     rename/remove existing fields or collections.
  2. Every read goes through normGroup / normCategory / normItem (safe defaults).
     When you add a field, add its default there too.
  3. Every Firestore call lives in the "DB LAYER" section as a small function.
     UI code must never call Firestore directly.
  4. All UI text lives in I18N (bn + en). Add keys to BOTH languages.
  5. Never put user text into innerHTML. Use el() / textContent. Links and
     images must pass safeUrl() (http/https only).
  6. Wrap Firestore actions with run() so errors become toasts.
  7. If you add a field to Firestore, also update firestore.rules validation
     (optional-field style) and the export/import functions.

CHANGELOG
  1.0.0  Initial release: groups, categories, custom fields, items, image
         preview, price history, detail view, dashboard, search/filter/sort,
         budget planner, xlsx/csv/json export, json import (merge/replace),
         print CSS, settings, i18n bn/en, view-only mode, dark mode.
=============================================================================
-->

const $ = (sel, root = document) => root.querySelector(sel);
const PROP_KEYS = new Set(["value", "checked", "disabled", "selected", "readOnly"]);

/** Safe DOM builder: text is always added as text nodes (never as HTML). */
function el(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === undefined || v === null || v === false) continue;
      if (k === "class") node.className = v;
      else if (k === "style" && typeof v === "object") {
        for (const [sk, sv] of Object.entries(v)) {
          if (sk.startsWith("--")) node.style.setProperty(sk, sv); else node.style[sk] = sv;
        }
      } else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
      else if (PROP_KEYS.has(k)) node[k] = v;
      else node.setAttribute(k, v === true ? "" : String(v));
    }
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return node;
}

function selectEl(options, value, attrs) {
  const s = el("select", attrs, options.map((o) => el("option", { value: o.value }, o.label)));

  return s;
}

const randId = (n = 4) => Math.random().toString(36).slice(2, 2 + n).padEnd(n, "0");
const pad2 = (n) => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };

/** Only http/https URLs are accepted. Returns "" if invalid. */
function safeUrl(u) {
  if (typeof u !== "string" || !u.trim()) return "";
  try {
    const url = new URL(u.trim());
    return (url.protocol === "http:" || url.protocol === "https:") ? url.href : "";
  } catch { return ""; }
}

function slugKey(label, existing) {
  const base = "f_" + (String(label).toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 16) || "x");

  do { key = `${base}_${randId(4)}`; } while (existing.has(key));

}

function toast(msg, type = "info") {

const modalStack = [];
function openModal({ title, size = "", onClose } = {}) {
  const body = el("div", { class: "modal-body" });
  const footer = el("div", { class: "modal-foot" });
  const api = {
    body, footer, closed: false,
    close() {
      if (api.closed) return;
      api.closed = true; overlay.remove();
      modalStack.splice(modalStack.indexOf(api), 1);
      if (!modalStack.length) document.body.classList.remove("modal-open");
      if (onClose) onClose();
    }
  };
  const box = el("div", { class: `modal ${size}`, role: "dialog", "aria-modal": "true" },
    el("div", { class: "modal-head" }, el("h3", null, title),
      el("button", { class: "icon-btn", type: "button", "aria-label": t("close"), onclick: () => api.close() }, "✕")),
    body, footer);
  const overlay = el("div", { class: "overlay" }, box);
  overlay.addEventListener("mousedown", (e) => { if (e.target === overlay) api.close(); });
  modalStack.push(api);
  document.body.append(overlay);
  document.body.classList.add("modal-open");
  return api;
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && modalStack.length) modalStack[modalStack.length - 1].close();
});

function confirmDialog({ title, message, confirmText, danger = true, extra }) {
  return new Promise((resolve) => {
    let result = false;
    const m = openModal({ title, size: "sm", onClose: () => resolve(result) });
    m.body.append(el("p", { class: "pre" }, message));
    if (extra) m.body.append(extra);
    m.footer.append(
      el("button", { class: "btn", type: "button", onclick: () => m.close() }, t("cancel")),
      el("button", { class: `btn ${danger ? "btn-danger" : "btn-primary"}`, type: "button", onclick: () => { result = true; m.close(); } }, confirmText || t("delete"))
    );
  });
}

/** Runs a Firestore action; errors -> toast. If the server does not answer in time
 *  (offline), the write is queued by Firestore and we tell the user. */
async function run(fn, okMsg, timeoutMs = 6000) {
  try {
    const p = Promise.resolve().then(fn);
    const r = await Promise.race([p, new Promise((res) => setTimeout(() => res("__pending__"), timeoutMs))]);
    if (r === "__pending__") {
      toast(t("toastQueued"), "info");
      p.catch((e) => { console.error(e); toast(errText(e), "error"); });
      return true;
    }
    if (okMsg) toast(okMsg, "success");
    return true;
  } catch (e) {
    console.error(e);
    toast(errText(e), "error");
    return false;
  }
}
const errText = (e) => `${t("errGeneric")}: ${e && (e.code || e.message) ? (e.code || e.message) : e}`;

function downloadFile(filename, content, mime) {
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = el("a", { href: url, download: filename });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/** Image with lazy loading, no-referrer and a placeholder when it fails. */
function makeImage(url, alt, cls = "") {
  const box = el("div", { class: `imgbox ${cls}` });
  const showPlaceholder = () => { box.replaceChildren(el("div", { class: "img-ph", title: t("imageFail") }, "🖼️")); };
  const safe = safeUrl(url);
  if (!safe) { showPlaceholder(); return box; }
  const img = el("img", { src: safe, alt: alt || "", loading: "lazy", decoding: "async", referrerpolicy: "no-referrer" });
  img.addEventListener("error", showPlaceholder, { once: true });
  box.append(img);
  return box;
}

/* =============================================================================
   DB LAYER  (the ONLY place that touches Firestore)
   ============================================================================= */
let db = null;
let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; renderAll(); });
}

function dbInit() {
  const app = initializeApp(FIREBASE_CONFIG);
  try {
    db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  } catch (e) {
    console.warn("Persistent cache unavailable, using default.", e);
    db = getFirestore(app);
  }
}

function dbSubscribeAll() {
  const fail = (name) => (err) => {
    console.error(name, err);
    state.dbError = `${name}: ${err.code || err.message}`;
    state.loaded[name] = true; scheduleRender();
  };
  const listen = (name, norm, sortFn) => onSnapshot(collection(db, name), (snap) => {
    state[name] = snap.docs.map((d) => norm({ ...d.data({ serverTimestamps: "estimate" }), id: d.id })).sort(sortFn);
    state.loaded[name] = true; state.dbError = ""; scheduleRender();
  }, fail(name));
  const byOrder = (a, b) => (a.order - b.order) || a.name.localeCompare(b.name);
  listen("groups", normGroup, byOrder);
  listen("categories", normCategory, byOrder);
  listen("items", normItem, () => 0);
  onSnapshot(doc(db, "meta", "app"), (snap) => {
    const d = snap.exists() ? snap.data() : {};
    state.settings = {
      siteTitle: str(d.siteTitle, 200) || DEFAULT_SETTINGS.siteTitle,
      currencySymbol: str(d.currencySymbol, 16) || DEFAULT_SETTINGS.currencySymbol
    };
    state.loaded.meta = true; scheduleRender();
  }, fail("meta"));
}

async function dbCommitOps(ops) {            // chunked batch writes
  for (let i = 0; i < ops.length; i += BATCH_LIMIT) {
    const batch = writeBatch(db);
    for (const op of ops.slice(i, i + BATCH_LIMIT)) {
      if (op.type === "delete") batch.delete(op.ref);
      else if (op.type === "update") batch.update(op.ref, op.data);
      else batch.set(op.ref, op.data);
    }
    await batch.commit();
  }
}

async function dbDeleteGroupCascade(groupId) {
  const [its, cats] = await Promise.all([
    getDocs(query(collection(db, "items"), where("groupId", "==", groupId))),

  ]);
  const ops = [...its.docs, ...cats.docs].map((d) => ({ type: "delete", ref: d.ref }));
  ops.push({ type: "delete", ref: doc(db, "groups", groupId) });   // group last
  await dbCommitOps(ops);
}

const dbCreateCategory = (c) => addDoc(collection(db, "categories"), { ...c, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });

  const ops = its.docs.map((d) => ({ type: "update", ref: d.ref, data: { categoryId: "", updatedAt: serverTimestamp() } }));

const toStamp = (v) => { const ms = toMs(v); return ms > 0 ? Timestamp.fromMillis(ms) : serverTimestamp(); };

/** Restore from parsed backup. mode: "merge" | "replace". */
async function dbImportBackup(bk, mode) {
  const ops = [];
  if (mode === "replace") {
    for (const name of ["items", "categories", "groups"]) {
      const snap = await getDocs(collection(db, name));
      snap.docs.forEach((d) => ops.push({ type: "delete", ref: d.ref }));
    }
  }
  bk.groups.forEach((g) => ops.push({ type: "set", ref: doc(db, "groups", g.id), data: {
    name: g.name, icon: g.icon, color: g.color, order: g.order, fieldDefs: g.fieldDefs,
    createdAt: toStamp(g.createdAt), updatedAt: serverTimestamp() } }));
  bk.categories.forEach((c) => ops.push({ type: "set", ref: doc(db, "categories", c.id), data: {
    groupId: c.groupId, name: c.name, order: c.order, createdAt: toStamp(c.createdAt), updatedAt: serverTimestamp() } }));
  bk.items.forEach((i) => ops.push({ type: "set", ref: doc(db, "items", i.id), data: {
    ...pickItemData(i), boughtAt: toMs(i.boughtAt) > 0 ? Timestamp.fromMillis(toMs(i.boughtAt)) : null,
    createdAt: toStamp(i.createdAt), updatedAt: serverTimestamp() } }));
  await dbCommitOps(ops);
  if (mode === "replace" && bk.meta) {
    await dbSaveMeta({
      siteTitle: str(bk.meta.siteTitle, 200) || DEFAULT_SETTINGS.siteTitle,
      currencySymbol: str(bk.meta.currencySymbol, 16) || DEFAULT_SETTINGS.currencySymbol
    });
  }
}

/* ---- dashboard ---- */
function computeStats(items) {
  const s = { total: 0, remaining: 0, bought: 0, count: { all: items.length, want: 0, bought: 0, skipped: 0 }, byGroup: {} };
  for (const it of items) {
    s.count[it.status]++;
    const bg = (s.byGroup[it.groupId] = s.byGroup[it.groupId] || { total: 0, remaining: 0, count: 0 });
    bg.count++;
    if (it.status === "skipped") continue;
    const v = itemTotal(it);
    s.total += v; bg.total += v;
    if (it.status === "bought") s.bought += v; else { s.remaining += v; bg.remaining += v; }
  }
  return s;
}

function renderDashboard() {
  const root = $("#dashboard"); root.replaceChildren();
  if (!allLoaded()) {
    root.append(el("div", { class: "stats" }, [0, 1, 2, 3].map(() => el("div", { class: "stat skel", style: { height: "78px" } }))));
    return;
  }
  const s = computeStats(state.items);
  const stat = (label, value, sub, cls = "") => el("div", { class: `stat ${cls}` },
    el("div", { class: "stat-label" }, label), el("div", { class: "stat-value" }, value), sub ? el("div", { class: "stat-sub" }, sub) : null);
  root.append(el("div", { class: "stats" },
    stat(t("dashTotal"), money(s.total), t("dashNote")),
    stat(t("dashRemaining"), money(s.remaining), `${s.count.want} ${t("want")}`, "stat-warn"),
    stat(t("dashBought"), money(s.bought), `${s.count.bought} ${t("bought")}`, "stat-ok"),
    stat(t("dashItems"), fmtNum(s.count.all), `${s.count.want} ${t("want")} · ${s.count.bought} ${t("bought")} · ${s.count.skipped} ${t("skipped")}`)));
  if (state.groups.length) {
    root.append(el("div", { class: "group-totals" }, el("div", { class: "muted small" }, t("dashPerGroup")),
      el("div", { class: "gt-row" }, state.groups.map((g) => {

/* ---- items ---- */
function getVisibleItems() {
  const ui = state.ui, q = ui.search.trim().toLowerCase();
  let list = state.items.filter((it) => {
    if (ui.groupId !== "all" && it.groupId !== ui.groupId) return false;
    if (ui.categoryId === "none" ? it.categoryId !== "" : (ui.categoryId !== "all" && it.categoryId !== ui.categoryId)) return false;
    if (ui.status !== "all" && it.status !== ui.status) return false;
    if (ui.priority !== "all" && it.priority !== ui.priority) return false;
    return !q || it.name.toLowerCase().includes(q);
  });
  const byName = (a, b) => a.name.localeCompare(b.name, state.lang);
  const cmp = {
    newest: (a, b) => toMs(b.createdAt) - toMs(a.createdAt),
    priceHigh: (a, b) => b.price - a.price, priceLow: (a, b) => a.price - b.price, name: byName,
    priority: (a, b) => (PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority]) || byName(a, b)
  }[ui.sort] || (() => 0);
  return list.sort(cmp);
}

/* ---- group form ---- */
function openGroupForm(group) {
  const isEdit = !!group;
  const m = openModal({ title: isEdit ? t("editGroup") : t("addGroup"), size: "sm" });
  const name = el("input", { class: "input", type: "text", maxlength: "100", value: group ? group.name : "", placeholder: t("groupName") });
  const icon = el("input", { class: "input", type: "text", maxlength: "8", value: group ? group.icon : "🎯" });
  const color = el("input", { class: "color-input", type: "color", value: group ? group.color : DEFAULT_COLOR });
  const emojiRow = el("div", { class: "pick-row" }, EMOJI_CHOICES.map((e) => el("button", { class: "pick", type: "button", onclick: () => { icon.value = e; } }, e)));
  const colorRow = el("div", { class: "pick-row" }, COLOR_PRESETS.map((c) => el("button", { class: "pick swatch", type: "button", style: { background: c }, "aria-label": c, onclick: () => { color.value = c; } })));
  m.body.append(field(t("groupName"), name), field(t("icon"), icon), emojiRow, field(t("color"), color), colorRow);
  const saveBtn = el("button", { class: "btn btn-primary", type: "button" }, t("save"));
  saveBtn.onclick = async () => {
    const n = name.value.trim();
    if (!n) { toast(t("nameRequired"), "error"); name.focus(); return; }
    saveBtn.disabled = true;
    const data = { name: n, icon: icon.value.trim() || "📁", color: isHex(color.value) ? color.value : DEFAULT_COLOR };
    let newId = null;
    const ok = await run(async () => {
      if (isEdit) await dbUpdateGroup(group.id, data);
      else { const ref = await dbCreateGroup({ ...data, order: nextOrder(state.groups), fieldDefs: [] }); newId = ref.id; }
    }, t("toastSaved"));
    if (ok) { if (newId) selectGroup(newId); m.close(); } else saveBtn.disabled = false;
  };
  name.addEventListener("keydown", (e) => { if (e.key === "Enter") saveBtn.click(); });
  m.footer.append(el("button", { class: "btn", type: "button", onclick: () => m.close() }, t("cancel")), saveBtn);
  setTimeout(() => name.focus(), 50);
}

async function deleteGroupFlow(g) {
  const items = state.items.filter((i) => i.groupId === g.id).length, cats = categoriesOf(g.id).length;
  const ok = await confirmDialog({ title: t("confirmDeleteGroupTitle"), message: t("confirmDeleteGroupMsg", { name: g.name, items, cats }) });
  if (!ok) return;
  const done = await run(() => dbDeleteGroupCascade(g.id), t("toastDeleted"), 30000);

async function addSampleGroupsFlow() {
  const existing = new Set(state.groups.map((g) => g.name.toLowerCase()));
  const list = SAMPLE_GROUPS.filter((g) => !existing.has(g.name.toLowerCase()));
  if (!list.length) { toast(t("sampleExists"), "info"); return; }

/* ---- item form ---- */
function makeCustomControl(def, value) {
  switch (def.type) {
    case "checkbox": return el("input", { type: "checkbox", class: "checkbox", checked: !!value });
    case "number": return el("input", { class: "input", type: "number", step: "any", value: isFiniteNum(value) ? String(value) : "" });
    case "date": return el("input", { class: "input", type: "date", value: typeof value === "string" ? value : "" });
    case "url": return el("input", { class: "input", type: "url", placeholder: "https://", value: typeof value === "string" ? value : "" });
    case "select": {
      const opts = [...def.options];
      if (typeof value === "string" && value && !opts.includes(value)) opts.push(value);   // keep legacy value
      return selectEl([{ value: "", label: "—" }, ...opts.map((o) => ({ value: o, label: o }))], typeof value === "string" ? value : "", { class: "input" });
    }
    default: return el("input", { class: "input", type: "text", maxlength: "2000", value: value === undefined || value === null ? "" : String(value) });
  }
}
/** Returns the value to store, or undefined to remove the key. Throws on invalid link. */
function readCustomControl(def, node) {
  if (def.type === "checkbox") return node.checked;
  const raw = node.value.trim(); if (raw === "") return undefined;
  if (def.type === "number") { const n = Number(raw); return Number.isFinite(n) ? n : undefined; }
  if (def.type === "url") { if (!safeUrl(raw)) throw new Error(t("badUrl")); return raw.slice(0, 2000); }
  return raw.slice(0, 2000);
}

  const target = el("input", { class: "input", type: "date", value: base.targetDate || "" });
  const link = el("input", { class: "input", type: "url", placeholder: "https://", maxlength: "2000", value: base.productLink || "" });
  const image = el("input", { class: "input", type: "url", placeholder: "https://…/photo.jpg", maxlength: "2000", value: base.imageUrl || "" });
  const preview = el("div", { class: "img-preview" });
  const desc = el("textarea", { class: "input", rows: "3", maxlength: "5000" }); desc.value = base.description || "";
  const notes = el("textarea", { class: "input", rows: "3", maxlength: "5000" }); notes.value = base.notes || "";
  const customBox = el("div", { class: "custom-box" });

  // live image preview (debounced)
  let previewTimer = null;
  const updatePreview = () => {
    const url = image.value.trim();
    preview.replaceChildren(url ? makeImage(url, "", "preview-img") : el("div", { class: "muted small" }, t("imagePreview")));
  };
  image.addEventListener("input", () => { clearTimeout(previewTimer); previewTimer = setTimeout(updatePreview, 350); });
  updatePreview();

  // categories depend on selected group
  function refreshCategories() {
    const keep = category.value || base.categoryId || "";
    const cats = categoriesOf(group.value);
    category.replaceChildren(el("option", { value: "" }, "— " + t("uncategorized") + " —"), ...cats.map((c) => el("option", { value: c.id }, c.name)));
    category.value = cats.some((c) => c.id === keep) ? keep : "";
  }

  // custom fields depend on selected group; keep typed values when switching
  const customDraft = { ...(base.custom || {}) };
  let customCtrls = [];
  function captureCustom() {
    customCtrls.forEach(({ def, node }) => {
      try { const v = readCustomControl(def, node); if (v === undefined) delete customDraft[def.key]; else customDraft[def.key] = v; } catch { /* keep draft */ }
    });
  }
  function refreshCustom() {
    captureCustom();
    const defs = fieldDefsOf(group.value);
    customCtrls = defs.map((def) => ({ def, node: makeCustomControl(def, customDraft[def.key]) }));
    customBox.replaceChildren(...customCtrls.map(({ def, node }) =>
      def.type === "checkbox" ? el("label", { class: "field check-field" }, node, el("span", null, def.label)) : field(def.label, node)));
    customBox.hidden = !defs.length;
  }
  group.addEventListener("change", () => { refreshCategories(); refreshCustom(); });
  refreshCategories(); refreshCustom();

  m.body.append(el("div", { class: "form-grid" },
    field(t("itemName") + " *", name),
    field(t("group"), group), field(t("category"), category),
    field(t("price"), price), field(t("quantity"), qty),
    field(t("priority"), priority), field(t("status"), status),
    field(t("targetDate"), target),
    field(t("productLink"), link),
    el("div", { class: "span-2" }, field(t("imageUrl"), image), preview),
    el("div", { class: "span-2" }, field(t("description"), desc)),
    el("div", { class: "span-2" }, field(t("notes"), notes)),
    el("div", { class: "span-2" }, customBox)));

  const saveBtn = el("button", { class: "btn btn-primary", type: "button" }, t("save"));
  saveBtn.onclick = async () => {
    const n = name.value.trim();
    if (!n) { toast(t("nameRequired"), "error"); name.focus(); return; }
    const p = price.value.trim() === "" ? 0 : Number(price.value);
    if (!Number.isFinite(p) || p < 0) { toast(t("priceInvalid"), "error"); price.focus(); return; }
    const q = Math.floor(Number(qty.value));
    if (!Number.isFinite(q) || q < 1) { toast(t("qtyInvalid"), "error"); qty.focus(); return; }
    const linkVal = link.value.trim(), imgVal = image.value.trim();
    if ((linkVal && !safeUrl(linkVal)) || (imgVal && !safeUrl(imgVal))) { toast(t("badUrl"), "error"); return; }
    const custom = { ...customDraft };
    try {
      customCtrls.forEach(({ def, node }) => { const v = readCustomControl(def, node); if (v === undefined) delete custom[def.key]; else custom[def.key] = v; });
    } catch (e) { toast(e.message, "error"); return; }

    // price history: append {date, price} when price changed (or first non-zero price)
    const history = isEdit ? [...base.priceHistory] : [];
    if ((isEdit && p !== base.price) || (!isEdit && p > 0)) history.push({ date: todayStr(), price: p });

    const data = {
      groupId: group.value, categoryId: category.value, name: n, productLink: linkVal, imageUrl: imgVal,
      price: p, quantity: q, priority: priority.value, status: status.value, targetDate: target.value || "",
      description: desc.value.trim().slice(0, 5000), notes: notes.value.trim().slice(0, 5000), custom, priceHistory: history
    };
    if (status.value !== "bought") data.boughtAt = null;
    else if (!isEdit || base.status !== "bought") data.boughtAt = serverTimestamp();

    saveBtn.disabled = true;
    const ok = await run(() => (isEdit ? dbUpdateItem(base.id, data) : dbCreateItem({ boughtAt: null, ...data })), t("toastSaved"));
    if (ok) m.close(); else saveBtn.disabled = false;
  };
  m.footer.append(el("button", { class: "btn", type: "button", onclick: () => m.close() }, t("cancel")), saveBtn);
  setTimeout(() => name.focus(), 50);
}

/* ---- item actions ---- */
async function duplicateItem(it) {
  const data = pickItemData(it);
  data.name = `${it.name} ${t("copySuffix")}`.slice(0, 200);
  data.status = it.status === "bought" ? "want" : it.status;
  data.priceHistory = it.price > 0 ? [{ date: todayStr(), price: it.price }] : [];
  await run(() => dbCreateItem({ ...data, boughtAt: null }), t("toastCreated"));
}
async function setBought(it, bought) {
  await run(() => dbUpdateItem(it.id, bought ? { status: "bought", boughtAt: serverTimestamp() } : { status: "want", boughtAt: null }),
    bought ? t("toastBought") : t("toastSaved"));
}
async function deleteItemFlow(it) {
  if (!(await confirmDialog({ title: t("confirmDeleteItemTitle"), message: t("confirmDeleteItemMsg", { name: it.name }) }))) return false;
  return run(() => dbDeleteItem(it.id), t("toastDeleted"));
}

      el("button", { class: "btn edit-only", type: "button", onclick: async () => { m.close(); await setBought(it, it.status !== "bought"); } },
        it.status !== "bought" ? "✅ " + t("markBought") : "↩️ " + t("markWant")),
      el("button", { class: "btn btn-danger-ghost edit-only", type: "button", onclick: async () => { if (await deleteItemFlow(it)) m.close(); } }, "🗑️ " + t("delete")));
  }
}

/* ---- budget planner ---- */
function planBudget(moneyHave, groupId) {
  const wants = state.items.filter((i) => i.status === "want" && (groupId === "all" || i.groupId === groupId));
  wants.sort((a, b) => (PRIORITY_RANK[a.priority] - PRIORITY_RANK[b.priority]) || (itemTotal(a) - itemTotal(b)) || a.name.localeCompare(b.name));
  let running = 0; const affordable = [], notYet = [];
  for (const it of wants) {
    const cost = itemTotal(it);
    if (running + cost <= moneyHave) { running += cost; affordable.push({ it, cost, running, left: moneyHave - running }); }
    else notYet.push({ it, cost });
  }
  return { affordable, notYet, spent: running, left: moneyHave - running, wantCount: wants.length };
}

function openBudget() {
  const m = openModal({ title: "💰 " + t("budgetTitle"), size: "lg" });
  const input = el("input", { class: "input", type: "number", min: "0", step: "any", inputmode: "decimal", value: state.budget.money, placeholder: "0" });
  const groupSel = selectEl([{ value: "all", label: t("all") }, ...state.groups.map((g) => ({ value: g.id, label: `${g.icon} ${g.name}` }))], state.budget.groupId, { class: "input" });
  const out = el("div", { class: "budget-out" });

  function renderResult() {
    state.budget.money = input.value; state.budget.groupId = groupSel.value;
    out.replaceChildren();
    const have = Number(input.value);
    if (!input.value.trim() || !Number.isFinite(have) || have < 0) return;
    const plan = planBudget(have, groupSel.value);
    if (!plan.wantCount) { out.append(el("p", { class: "muted" }, t("budgetEmpty"))); return; }
    out.append(el("div", { class: "stats stats-sm" },
      el("div", { class: "stat" }, el("div", { class: "stat-label" }, t("budgetMoney")), el("div", { class: "stat-value" }, money(have))),
      el("div", { class: "stat" }, el("div", { class: "stat-label" }, t("budgetSpent")), el("div", { class: "stat-value" }, money(plan.spent))),
      el("div", { class: "stat stat-ok" }, el("div", { class: "stat-label" }, t("budgetLeft")), el("div", { class: "stat-value" }, money(plan.left)))));
    out.append(el("h4", null, "✅ " + t("budgetPlan")));
    if (!plan.affordable.length) out.append(el("p", { class: "muted" }, t("budgetNone")));
    else out.append(el("div", { class: "table-wrap" }, el("table", { class: "tbl" },
      el("thead", null, el("tr", null, ["#", t("colName"), t("priority"), t("colPrice"), t("colRunning"), t("colLeft")].map((h) => el("th", null, h)))),
      el("tbody", null, plan.affordable.map((r, i) => el("tr", null,
        el("td", null, i + 1), el("td", null, r.it.name),
        el("td", null, el("span", { class: `prio-dot prio-${r.it.priority}` }), t(r.it.priority)),
        el("td", null, money(r.cost)), el("td", null, money(r.running)), el("td", null, money(r.left))))))));
    if (plan.notYet.length) {
      out.append(el("h4", null, "⏳ " + t("budgetNot")),
        el("ul", { class: "history" }, plan.notYet.map(({ it, cost }) => el("li", null,
          el("span", null, `${it.name} · ${money(cost)}`),
          el("span", { class: "muted small" }, t("budgetNeeds", { amount: money(Math.max(0, cost - plan.left)) }))))));
    }
  }
  input.addEventListener("input", renderResult);
  groupSel.addEventListener("change", renderResult);
  m.body.append(el("div", { class: "form-grid" }, field(t("budgetMoney") + " (" + state.settings.currencySymbol + ")", input), field(t("budgetGroup"), groupSel)),
    el("p", { class: "muted small" }, t("budgetHint")), out);
  m.footer.append(el("button", { class: "btn", type: "button", onclick: () => m.close() }, t("close")));
  renderResult();
  setTimeout(() => input.focus(), 50);
}

/* ---- export helpers ---- */
const EXPORT_BASE_HEADERS = ["ID", "Group", "Category", "Name", "Product link", "Image URL", "Price", "Quantity", "Total",
  "Priority", "Status", "Target date", "Description", "Notes", "Bought at", "Created at"];

/** Items flattened to a table; custom fields become extra columns (merged by label). */
function buildItemsTable() {
  const colIndex = new Map(), customCols = [];
  state.groups.forEach((g) => g.fieldDefs.forEach((d) => { if (!colIndex.has(d.label)) { colIndex.set(d.label, customCols.length); customCols.push(d.label); } }));
  const headers = [...EXPORT_BASE_HEADERS, ...customCols.map((l) => (EXPORT_BASE_HEADERS.includes(l) ? `${l} (custom)` : l))];
  const groupOrder = new Map(state.groups.map((g, i) => [g.id, i]));
  const items = [...state.items].sort((a, b) => ((groupOrder.get(a.groupId) ?? 999) - (groupOrder.get(b.groupId) ?? 999)) || a.name.localeCompare(b.name));
  const rows = items.map((it) => {
    const row = [it.id, getGroup(it.groupId)?.name || "", getCategory(it.categoryId)?.name || "", it.name, it.productLink, it.imageUrl,
      it.price, it.quantity, itemTotal(it), it.priority, it.status, it.targetDate, it.description, it.notes,
      isoDate(toMs(it.boughtAt)), isoDate(toMs(it.createdAt))];
    const extra = new Array(customCols.length).fill("");
    fieldDefsOf(it.groupId).forEach((d) => {
      const v = it.custom[d.key]; if (v === undefined || v === null) return;
      extra[colIndex.get(d.label)] = d.type === "checkbox" ? (v ? "Yes" : "No") : v;
    });
    return [...row, ...extra];
  });
  return { headers, rows };
}

function csvCell(v) {
  let s = v === null || v === undefined ? "" : String(v);
  if (typeof v === "string" && /^[=+@]/.test(s)) s = "'" + s;           // avoid spreadsheet formula injection
  return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
const stamp = () => todayStr();

function exportCsv() {
  const { headers, rows } = buildItemsTable();
  const csv = [headers, ...rows].map((r) => r.map(csvCell).join(",")).join("\r\n");
  downloadFile(`wishlist-items-${stamp()}.csv`, "\uFEFF" + csv, "text/csv;charset=utf-8");
  toast(t("toastExported"), "success");
}

function exportXlsx() {
  const X = window.XLSX;
  if (!X) { toast(t("xlsxMissing"), "error"); return; }
  const wb = X.utils.book_new();
  const groupsAoa = [["ID", "Name", "Icon", "Color", "Order", "Custom fields"],
    ...state.groups.map((g) => [g.id, g.name, g.icon, g.color, g.order, g.fieldDefs.map((d) => `${d.label} (${d.type})`).join("; ")])];
  const catsAoa = [["ID", "Group", "Name", "Order"],
    ...state.categories.map((c) => [c.id, getGroup(c.groupId)?.name || "", c.name, c.order])];
  const { headers, rows } = buildItemsTable();
  X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(groupsAoa), "Groups");
  X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(catsAoa), "Categories");
  X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet([headers, ...rows]), "Items");
  X.writeFile(wb, `wishlist-${stamp()}.xlsx`);
  toast(t("toastExported"), "success");
}

function exportJson() {
  const data = {
    app: "wishlist-manager", schemaVersion: SCHEMA_VERSION, exportedAt: new Date().toISOString(),
    meta: { schemaVersion: SCHEMA_VERSION, ...state.settings },
    groups: state.groups.map((g) => ({ ...g, createdAt: toMs(g.createdAt), updatedAt: toMs(g.updatedAt) })),
    categories: state.categories.map((c) => ({ ...c, createdAt: toMs(c.createdAt), updatedAt: toMs(c.updatedAt) })),
    items: state.items.map((i) => ({ ...i, boughtAt: toMs(i.boughtAt) || null, createdAt: toMs(i.createdAt), updatedAt: toMs(i.updatedAt) }))
  };
  downloadFile(`wishlist-backup-${stamp()}.json`, JSON.stringify(data, null, 2), "application/json");
  toast(t("toastExported"), "success");
}

/* ---- import ---- */
const validDocId = (id) => typeof id === "string" && id.length > 0 && id.length <= 200 && !id.includes("/") && id !== "." && id !== "..";
function parseBackup(text) {
  let data;
  try { data = JSON.parse(text); } catch { throw new Error(t("importInvalid")); }
  if (!data || typeof data !== "object" || !Array.isArray(data.groups) || !Array.isArray(data.categories) || !Array.isArray(data.items)) throw new Error(t("importInvalid"));
  const ok = (x) => x && typeof x === "object" && validDocId(x.id);
  return {
    meta: data.meta && typeof data.meta === "object" ? data.meta : null,
    groups: data.groups.filter(ok).map(normGroup),
    categories: data.categories.filter(ok).map(normCategory),
    items: data.items.filter(ok).map(normItem)
  };
}

async function importFlow(file, mode) {
  let bk;
  try { bk = parseBackup(await file.text()); } catch (e) { toast(e.message, "error"); return false; }
  const modeLabel = mode === "replace" ? t("importReplace") : t("importMerge");
  const warn = mode === "replace" ? el("p", { class: "warn-text" }, "⚠️ " + t("importReplaceWarn")) : null;
  const yes = await confirmDialog({
    title: t("importConfirmTitle"), confirmText: t("importJson"), danger: mode === "replace", extra: warn,
    message: t("importConfirmMsg", { groups: bk.groups.length, cats: bk.categories.length, items: bk.items.length, mode: modeLabel })
  });
  if (!yes) return false;
  return run(() => dbImportBackup(bk, mode), t("toastImported"), 120000);
}

function openBackup() {
  const m = openModal({ title: "💾 " + t("backupTitle"), size: "md" });
  m.body.append(el("h4", null, t("exportSection")),
    el("div", { class: "btn-row" },
      el("button", { class: "btn", type: "button", onclick: exportXlsx }, "📊 " + t("exportXlsx")),
      el("button", { class: "btn", type: "button", onclick: exportCsv }, "📄 " + t("exportCsv")),
      el("button", { class: "btn", type: "button", onclick: exportJson }, "🧾 " + t("exportJson")),
      el("button", { class: "btn", type: "button", onclick: () => { m.close(); setTimeout(() => window.print(), 250); } }, "🖨️ " + t("print"))));
  if (!VIEW_ONLY) {
    const fileInput = el("input", { class: "input", type: "file", accept: "application/json,.json" });
    const modeSel = selectEl([{ value: "merge", label: t("importMerge") }, { value: "replace", label: t("importReplace") }], "merge", { class: "input" });
    const importBtn = el("button", { class: "btn btn-primary", type: "button" }, "⬆️ " + t("importJson"));
    importBtn.onclick = async () => {
      const f = fileInput.files && fileInput.files[0];
      if (!f) { toast(t("importChoose"), "error"); return; }
      importBtn.disabled = true;
      const ok = await importFlow(f, modeSel.value);
      importBtn.disabled = false;
      if (ok) m.close();
    };
    m.body.append(el("hr"), el("div", { class: "edit-only" }, el("h4", null, t("importSection")),
      field(t("importChoose"), fileInput), field(t("importMode"), modeSel), importBtn));
  }
  m.footer.append(el("button", { class: "btn", type: "button", onclick: () => m.close() }, t("close")));
}

/* ---- settings ---- */
function openSettings() {
  const m = openModal({ title: "⚙️ " + t("settingsTitle"), size: "sm" });
  const title = el("input", { class: "input", type: "text", maxlength: "200", value: state.settings.siteTitle });
  const cur = el("input", { class: "input", type: "text", maxlength: "16", value: state.settings.currencySymbol });
  const theme = selectEl([{ value: "light", label: t("themeLight") }, { value: "dark", label: t("themeDark") }], state.theme, { class: "input" });
  const lang = selectEl([{ value: "bn", label: "বাংলা" }, { value: "en", label: "English" }], state.lang, { class: "input" });
  if (!VIEW_ONLY) m.body.append(field(t("siteTitle"), title), field(t("currency"), cur));
  m.body.append(field(t("theme"), theme), field(t("language"), lang));
  const saveBtn = el("button", { class: "btn btn-primary", type: "button" }, t("save"));
  saveBtn.onclick = async () => {
    state.theme = theme.value; lsSet("wl_theme", state.theme); applyTheme();
    const langChanged = lang.value !== state.lang;
    if (langChanged) { state.lang = lang.value; lsSet("wl_lang", state.lang); applyLang(); }
    if (!VIEW_ONLY && isConfigured()) {
      const next = { siteTitle: title.value.trim() || DEFAULT_SETTINGS.siteTitle, currencySymbol: cur.value.trim() || DEFAULT_SETTINGS.currencySymbol };
      if (next.siteTitle !== state.settings.siteTitle || next.currencySymbol !== state.settings.currencySymbol) {
        saveBtn.disabled = true;
        const ok = await run(() => dbSaveMeta(next), t("toastSaved"));
        if (!ok) { saveBtn.disabled = false; return; }
      }
    }
    m.close();
    if (langChanged) setLanguage(state.lang); else { buildShell(); renderAll(); }
  };
  m.footer.append(el("button", { class: "btn", type: "button", onclick: () => m.close() }, t("cancel")), saveBtn);
}

/* =============================================================================
   EVENTS
   ============================================================================= */
window.addEventListener("offline", () => toast(t("toastOffline"), "info"));
window.addEventListener("online", () => toast(t("toastOnline"), "success"));

/* =============================================================================
   INIT
   ============================================================================= */
function init() {
  document.body.classList.toggle("view-only", VIEW_ONLY);
  applyTheme(); applyLang();
  buildShell();
  if (!isConfigured()) { renderAll(); return; }          // friendly setup banner, no crash
  try { dbInit(); dbSubscribeAll(); }
  catch (e) { console.error(e); state.dbError = e.message || String(e); Object.keys(state.loaded).forEach((k) => { state.loaded[k] = true; }); }
  renderAll();
}
init();

}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,"Hind Siliguri",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:15px;transition:background .2s,color .2s}
body.modal-open{overflow:hidden}
h1,h2,h3,h4{margin:0;line-height:1.25}
h4{font-size:14px;margin:14px 0 8px}
p{margin:0 0 8px}
a{color:var(--primary)}
code{font-size:12px;word-break:break-all}
hr{border:0;border-top:1px solid var(--border);margin:16px 0}
[hidden]{display:none!important}
.muted{color:var(--muted)} .small{font-size:12.5px} .pre{white-space:pre-wrap;overflow-wrap:anywhere}
.warn-text{color:var(--danger);font-weight:600}

/* topbar */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.topbar-in{max-width:1200px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto}
.brand span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:flex;gap:4px;align-items:center;margin-left:auto}
.pill{background:var(--surface2);border:1px solid var(--border);padding:2px 10px;border-radius:999px;font-size:12px;color:var(--muted)}
.container{max-width:1200px;margin:0 auto;padding:16px 14px 110px}

/* buttons / inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-weight:500;cursor:pointer;text-decoration:none;transition:transform .08s,background .15s,border-color .15s}
.btn:hover{background:var(--surface2)} .btn:active{transform:scale(.97)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn-primary:hover{background:color-mix(in srgb,var(--primary) 88%,#000)}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-danger:hover{background:color-mix(in srgb,var(--danger) 88%,#000)}
.btn-danger-ghost{color:var(--danger)}
.btn-ghost{border-color:transparent;background:transparent;padding:8px 10px}
.btn-sm{padding:6px 10px;font-size:13px;border-radius:8px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:36px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--text);cursor:pointer;font:inherit;font-size:15px}
.icon-btn:hover{background:var(--surface2)} .icon-btn.danger:hover{background:color-mix(in srgb,var(--danger) 15%,transparent)}
.lang-btn{font-size:13px;font-weight:600;border-color:var(--border)}
.input{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;min-height:40px}
textarea.input{resize:vertical}
.input:focus,.btn:focus-visible,.icon-btn:focus-visible,.card:focus-visible,.chip:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.color-input{width:100%;height:42px;padding:2px;border-radius:10px;border:1px solid var(--border);background:var(--surface)}
.checkbox{width:20px;height:20px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.check-field{flex-direction:row;align-items:center;gap:8px}
.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.btn .lbl{color:inherit;font-weight:500;font-size:14px}
.hint{color:var(--muted)}
.hide-sm{display:none}
@media(min-width:760px){.hide-sm{display:inline-flex}}
@media(max-width:700px){.actions .btn .lbl{display:none}.actions .btn{padding:8px}.fab .lbl{display:none}}

/* dashboard */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}.stats-sm{grid-template-columns:repeat(3,1fr)}}
.stats-sm{grid-template-columns:repeat(3,1fr);margin-bottom:6px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.stat-label{font-size:12.5px;color:var(--muted);font-weight:600}
.stat-value{font-size:21px;font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.stat-sub{font-size:12px;color:var(--muted);margin-top:2px}
.stat-ok .stat-value{color:var(--success)} .stat-warn .stat-value{color:var(--warning)}
.group-totals{margin-top:12px}
.gt-row{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 8px;scrollbar-width:thin}
.gt{flex:0 0 auto;min-width:150px;text-align:left;display:flex;flex-direction:column;gap:1px;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--c);border-radius:12px;padding:8px 12px;cursor:pointer;color:var(--text);font:inherit}
.gt:hover{background:var(--surface2)} .gt-name{font-weight:600;font-size:13.5px} .gt-total{font-weight:700} .gt-sub{font-size:11.5px;color:var(--muted)}

/* groups */
#groupBar{margin-top:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--c)}
.chip.active{background:var(--c);border-color:var(--c);color:#fff}
.chip-count{font-size:12px;opacity:.75;background:color-mix(in srgb,currentColor 14%,transparent);padding:0 7px;border-radius:999px}
.chip-add{border-style:dashed;color:var(--muted)}
.group-actions{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 6px}

/* filters */
.filters{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.filter-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:760px){.filters{flex-direction:row;flex-wrap:wrap;align-items:center}.search{flex:1 1 240px;width:auto}.filter-row{display:flex;flex:2 1 520px}.filter-row .input{min-width:130px}#resultCount{width:100%}}

/* cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
@media(min-width:760px){.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}}
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--c,var(--primary));border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s;animation:pop .25s ease both}
.card:hover{transform:translateY(-2px)}
.card.status-bought{opacity:.85} .card.status-skipped{opacity:.6}
.card-media{position:relative;aspect-ratio:4/3;background:var(--surface2)}
.imgbox{width:100%;height:100%} .imgbox img{width:100%;height:100%;object-fit:cover;display:block}
.img-ph{width:100%;height:100%;min-height:80px;display:flex;align-items:center;justify-content:center;font-size:34px;background:linear-gradient(135deg,var(--surface2),var(--border));opacity:.9}
.badge{position:absolute;top:8px;left:8px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:#475467;color:#fff}
.badge.static{position:static;display:inline-block}
.st-want{background:#2563eb}.st-bought{background:var(--success)}.st-skipped{background:#6b7280}
.prio{position:absolute;top:8px;right:8px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--border)}
.prio-high.prio,.prio-b.prio-high{color:#b42318;background:#fee4e2;border-color:#fecdca}
.prio-medium.prio,.prio-b.prio-medium{color:#93370d;background:#fef0c7;border-color:#fedf89}
.prio-low.prio,.prio-b.prio-low{color:#05603a;background:#d1fadf;border-color:#a6f4c5}
.prio-b{position:static!important;border:1px solid;font-weight:600;font-size:11.5px;padding:2px 9px;border-radius:999px}
.prio-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#999}
.prio-dot.prio-high{background:#ef4444}.prio-dot.prio-medium{background:#f59e0b}.prio-dot.prio-low{background:#22c55e}
.card-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.card-title{font-size:15px;font-weight:600;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:11.5px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--primary)) 16%,transparent);color:var(--text)}
.tag-soft{background:var(--surface2);color:var(--muted)}
.card-price{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.price{font-weight:700;font-size:16px}
.mini-dl{margin:2px 0 0;display:grid;grid-template-columns:auto 1fr;gap:1px 8px;font-size:12px}
.mini-dl dt{color:var(--muted)} .mini-dl dd{margin:0;overflow-wrap:anywhere}
.card-actions{display:flex;gap:2px;justify-content:flex-end;padding:0 6px 6px;border-top:1px solid var(--border);padding-top:4px}
.empty{grid-column:1/-1;text-align:center;padding:40px 16px;background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius)}
.empty-ico{font-size:44px}.empty h3{margin:8px 0}.empty-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:15;display:inline-flex;align-items:center;gap:8px;padding:13px 18px;border-radius:999px;border:0;background:var(--primary);color:#fff;font:inherit;font-weight:600;box-shadow:0 8px 24px rgba(99,102,241,.45);cursor:pointer}
.fab .lbl{color:#fff;font-size:14px}.fab-plus{font-size:18px;line-height:1}

/* banners */
.banner{max-width:1200px;margin:12px auto 0;padding:12px 14px;border-radius:12px;border:1px solid}
.banner-warn{background:#fffaeb;border-color:#fedf89;color:#93370d}
.banner-error{background:#fef3f2;border-color:#fecdca;color:#b42318}
#banner{padding:0 14px}

/* skeleton */
.skel{background:linear-gradient(90deg,var(--surface2) 25%,var(--border) 50%,var(--surface2) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:10px}
.skel-card{pointer-events:none}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,14,25,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.modal{background:var(--surface);color:var(--text);width:100%;max-height:92vh;display:flex;flex-direction:column;border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:slide .2s ease}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:17px;overflow-wrap:anywhere}
.modal-body{padding:14px 16px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
.modal-foot:empty{display:none}
@media(min-width:640px){
  .overlay{align-items:center;padding:20px}
  .modal{border-radius:18px;max-width:560px}.modal.sm{max-width:420px}.modal.lg{max-width:760px}
}
@keyframes fade{from{opacity:0}}@keyframes slide{from{transform:translateY(24px);opacity:0}}
.form-grid{display:grid;grid-template-columns:1fr;gap:0 12px}
@media(min-width:640px){.form-grid{grid-template-columns:1fr 1fr}.span-2{grid-column:span 2}}
.span-2{grid-column:1/-1}
.custom-box{display:grid;grid-template-columns:1fr;gap:0 12px;border-top:1px dashed var(--border);padding-top:10px}
@media(min-width:640px){.custom-box{grid-template-columns:1fr 1fr}}
.img-preview{margin:-2px 0 10px;max-width:260px}
.img-preview .imgbox{aspect-ratio:4/3;border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.pick-row{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 12px}
.pick{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:18px}
.swatch{border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border)}
.rows{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}.row .input{flex:1;min-width:0}
.field-row{flex-wrap:wrap}.field-row .input{flex:1 1 150px}
.add-row{margin-top:8px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* detail */
.detail{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:640px){.detail{grid-template-columns:280px 1fr}}
.detail-img{aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:var(--surface2);border:1px solid var(--border)}
.detail-main{display:flex;flex-direction:column;gap:10px}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.info{background:var(--surface2);border-radius:10px;padding:8px 10px}.info-v{font-weight:600;overflow-wrap:anywhere}
.section{margin-top:12px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}.dl dt{color:var(--muted)}.dl dd{margin:0;overflow-wrap:anywhere}
.history{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.history li{display:flex;justify-content:space-between;gap:10px;background:var(--surface2);padding:6px 10px;border-radius:8px}

/* budget table */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td:nth-child(2){white-space:normal;min-width:140px}
.tbl th{background:var(--surface2);font-size:12px;color:var(--muted)}.tbl tr:last-child td{border-bottom:0}

/* toasts */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:100;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{pointer-events:auto;padding:11px 14px;border-radius:12px;background:#1f2937;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:14px;animation:slide .2s ease;transition:opacity .3s}
.toast-success{background:#15803d}.toast-error{background:#b42318}.toast.out{opacity:0}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* print / save as PDF */
@media print{
  html[data-theme]{--bg:#fff;--surface:#fff;--surface2:#f4f4f5;--text:#000;--muted:#444;--border:#cfcfcf;--shadow:none}
  body{background:#fff;font-size:12px}
  .no-print,.actions,.fab,#filterBar,.overlay,#toasts,.card-actions,.chip-add,.group-actions,.pill{display:none!important}
  .topbar{position:static;border:0}.container{padding:0}
  .grid{grid-template-columns:repeat(3,1fr)!important;gap:8px}
  .card{break-inside:avoid;box-shadow:none;animation:none}
  .chips,.gt-row{flex-wrap:wrap;overflow:visible}
  .stats{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<noscript>This app needs JavaScript.</noscript>
</body>
</html>
